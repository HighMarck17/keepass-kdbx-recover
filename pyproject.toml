[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keepass-kdbx-recover"
version = "1.0.0"
description = "Universal recovery tool for KeePass KDBX databases - recover your own master password from what you remember."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "HighMarck17" }]
keywords = ["keepass", "kdbx", "password", "recovery", "argon2", "aes-kdf"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "pykeepass>=4.0",
    "tomlkit>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyinstaller>=6.0",
]

[project.scripts]
keepass-kdbx-recover = "keepass_kdbx_recover.cli:main"
keepass-kdbx-recover-gui = "keepass_kdbx_recover.gui.app:main"
kpr = "keepass_kdbx_recover.cli:main"

[project.urls]
Homepage = "https://github.com/HighMarck17/keepass-kdbx-recover"
Repository = "https://github.com/HighMarck17/keepass-kdbx-recover"
Issues = "https://github.com/HighMarck17/keepass-kdbx-recover/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/keepass_kdbx_recover"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
